<!doctype html>
<html lang="tr" data-profile="{{ profile }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}finans-takip{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('site.css') }}">
</head>
<body>
  {% if profile == "sanal" %}
  <div class="band" role="status">{{ sanal_notice }}</div>
  {% endif %}
  <header>
    <nav class="profiles" aria-label="Portföy">
      {% for label, href, current in switch %}
      <a href="{{ href }}"{% if current %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <nav aria-label="Sayfalar">
      {% for href, label in nav %}
      <a href="{{ prefix }}{{ href }}"{% if href == subpath %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <span class="viewer">{{ viewer }}</span>
  </header>
  <main>
    {% if notice %}
    <p class="notice" role="status">{{ notice }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
