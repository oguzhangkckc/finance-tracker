<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}finans-takip{% endblock %}</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  {% if profile == "sanal" %}
  <div class="band" role="status">{{ sanal_notice }}</div>
  {% endif %}
  <header>
    <nav aria-label="Sayfalar">
      {% for href, label in nav %}
      <a href="{{ href }}"{% if href == path %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <span class="viewer">{{ viewer }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
